<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُقسِّم ملفات الإكسيل المتقدم (محسّن)</title>
    <!-- استدعاء مكتبة SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 { text-align: center; margin-top: 0; color: var(--text); font-size: 1.5rem; }

        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: #eff6ff;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-area:hover { background: #dbeafe; }

        .upload-area input[type="file"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .file-details {
            display: none; background: #f1f5f9; padding: 15px;
            border-radius: 8px; margin-top: 20px; border: 1px solid var(--border);
        }

        .file-details p { margin: 5px 0; font-size: 0.95rem; }

        .settings-group { margin-top: 20px; display: none; }
        
        .settings-row {
            display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap;
        }

        .setting-item { flex: 1; min-width: 200px; }

        .settings-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.95rem;}
        
        .settings-group input, .settings-group select {
            width: 100%; padding: 12px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 1rem; box-sizing: border-box;
            background-color: white;
        }

        button.start-btn {
            background-color: var(--primary); color: white; border: none;
            width: 100%; padding: 14px; font-size: 1.1rem; font-weight: bold;
            border-radius: 8px; cursor: pointer; margin-top: 10px;
            transition: 0.3s; display: none;
        }

        button.start-btn:hover { background-color: var(--primary-hover); }
        button.start-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .log-box {
            background: #1e293b; color: #e2e8f0; padding: 15px;
            border-radius: 8px; margin-top: 20px; height: 200px;
            overflow-y: auto; font-family: monospace; font-size: 0.9rem;
            line-height: 1.5; display: none;
        }

        .log-entry { margin-bottom: 5px; }
        .log-time { color: #94a3b8; font-size: 0.8rem; margin-left: 8px; }
        .log-info { color: #38bdf8; }
        .log-success { color: #4ade80; }
        .log-error { color: #f87171; }
        .log-warning { color: #facc15; }
    </style>
</head>
<body>

    <div class="container">
        <h2>مُقسِّم ملفات الإكسيل (محسّن للحجم الكبير)</h2>
        
        <div class="upload-area">
            <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">
            <svg style="width:48px;height:48px;color:#2563eb;margin-bottom:10px" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <div style="font-weight: bold;">اضغط هنا لاختيار الملف</div>
            <div style="font-size: 0.85rem; color: #64748b; margin-top: 5px;">يدعم الملفات الضخمة (مليون صف)</div>
        </div>

        <div class="file-details" id="fileDetails">
            <h4 style="margin-top: 0; color: var(--primary);">تفاصيل الملف:</h4>
            <p><strong>الاسم:</strong> <span id="fileName">-</span></p>
            <p><strong>الحجم الإجمالي:</strong> <span id="fileSize">-</span></p>
        </div>

        <div class="settings-group" id="settingsGroup">
            <div class="settings-row">
                <div class="setting-item">
                    <label for="splitCount">التقسيم إلى (عدد الملفات):</label>
                    <input type="number" id="splitCount" min="2" max="50" value="2">
                </div>
                <div class="setting-item">
                    <label for="outputFormat">صيغة الملف الناتج:</label>
                    <select id="outputFormat">
                        <option value="csv">CSV (أصغر حجم وأسرع - يُنصح به)</option>
                        <option value="xlsx">XLSX (مضغوط - للحفاظ على التنسيق)</option>
                    </select>
                </div>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-light); margin-top: 0;">
                <strong>الحجم المتوقع لكل ملف:</strong> <span id="expectedSize" style="color: var(--primary); font-weight: bold;">-</span>
            </p>
        </div>

        <button class="start-btn" id="startBtn" onclick="processFile()">البدء في التقسيم الآن</button>
        
        <div class="log-box" id="logBox"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileDetails = document.getElementById('fileDetails');
        const settingsGroup = document.getElementById('settingsGroup');
        const startBtn = document.getElementById('startBtn');
        const logBox = document.getElementById('logBox');
        const splitCountInput = document.getElementById('splitCount');
        const outputFormatInput = document.getElementById('outputFormat');
        
        let currentFile = null;

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function addLog(msg, type = 'info') {
            logBox.style.display = 'block';
            const time = new Date().toLocaleTimeString('ar-EG');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
            logBox.appendChild(logEntry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateExpectedSize() {
            if (!currentFile) return;
            const splits = parseInt(splitCountInput.value) || 2;
            const format = outputFormatInput.value;
            
            // الحساب التقريبي يختلف حسب الصيغة
            let expectedBytes = currentFile.size / splits;
            if (format === 'csv') {
                expectedBytes = expectedBytes * 0.4; // الـ CSV عادة أقل في الحجم بنسبة كبيرة
            }
            
            document.getElementById('expectedSize').textContent = formatBytes(expectedBytes);
        }

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                currentFile = e.target.files[0];
                document.getElementById('fileName').textContent = currentFile.name;
                document.getElementById('fileSize').textContent = formatBytes(currentFile.size);
                
                fileDetails.style.display = 'block';
                settingsGroup.style.display = 'block';
                startBtn.style.display = 'block';
                logBox.style.display = 'none';
                updateExpectedSize();
            }
        });

        splitCountInput.addEventListener('input', updateExpectedSize);
        outputFormatInput.addEventListener('change', updateExpectedSize);

        async function processFile() {
            if (!currentFile) return;
            
            const splits = parseInt(splitCountInput.value);
            const format = outputFormatInput.value;

            if (splits < 2) { alert('يجب أن يكون عدد التقسيمات 2 أو أكثر'); return; }

            startBtn.disabled = true;
            startBtn.textContent = 'جاري المعالجة... يرجى الانتظار';
            logBox.innerHTML = '';
            
            addLog(`تم بدء العملية. الملف: ${currentFile.name}`, 'info');
            
            const reader = new FileReader();

            reader.onload = async function(e) {
                try {
                    addLog('تمت قراءة الملف. جاري تحليل البيانات (قد يستغرق بعض الوقت للملايين صف)...', 'warning');
                    
                    setTimeout(() => {
                        try {
                            const data = new Uint8Array(e.target.result);
                            
                            // dense: true تمنع انهيار الذاكرة مع الملفات الكبيرة
                            const workbook = XLSX.read(data, {type: 'array', dense: true});
                            
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            
                            addLog('جاري استخراج البيانات...', 'info');
                            
                            // قراءة البيانات كصفوف بسيطة لتوفير الذاكرة
                            const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                            
                            if (jsonData.length <= 1) throw new Error("الملف فارغ!");

                            const header = jsonData[0];
                            const rows = jsonData.slice(1);
                            const totalRows = rows.length;
                            
                            addLog(`إجمالي الصفوف: ${totalRows.toLocaleString()} صف`, 'success');
                            
                            const rowsPerFile = Math.ceil(totalRows / splits);
                            addLog(`سيتم وضع تقريباً ${rowsPerFile.toLocaleString()} صف في كل ملف.`, 'info');

                            let generatedCount = 0;
                            const originalName = currentFile.name.substring(0, currentFile.name.lastIndexOf('.')) || currentFile.name;

                            for (let i = 0; i < splits; i++) {
                                const startRow = i * rowsPerFile;
                                const endRow = startRow + rowsPerFile;
                                const chunk = rows.slice(startRow, endRow);
                                
                                if (chunk.length === 0) break;

                                const partData = [header, ...chunk];
                                const newWb = XLSX.utils.book_new();
                                XLSX.utils.book_append_sheet(newWb, XLSX.utils.aoa_to_sheet(partData), "Data");
                                
                                const newFileName = `${originalName}_Part_${i + 1}.${format}`;
                                
                                // هنا سر الحجم: ضغط XLSX أو استخدام CSV
                                if (format === 'csv') {
                                    XLSX.writeFile(newWb, newFileName); // CSV يُكتب كنص مباشرة
                                } else {
                                    // تفعيل الضغط لتقليل الحجم
                                    XLSX.writeFile(newWb, newFileName, { compression: true });
                                }
                                
                                addLog(`تم إنشاء وتحميل: ${newFileName}`, 'success');
                                generatedCount++;
                            }

                            addLog(`تم الانتهاء! تم توليد ${generatedCount} ملفات بنجاح.`, 'success');

                        } catch (error) {
                            addLog(`خطأ داخلي: ${error.message}`, 'error');
                            console.error(error);
                        } finally {
                            startBtn.disabled = false;
                            startBtn.textContent = 'البدء في التقسيم الآن';
                        }
                    }, 100); 

                } catch (error) {
                    addLog(`حدث خطأ: ${error.message}`, 'error');
                    startBtn.disabled = false;
                    startBtn.textContent = 'البدء في التقسيم الآن';
                }
            };

            reader.onerror = () => {
                addLog('فشل في قراءة الملف.', 'error');
                startBtn.disabled = false;
            };

            addLog('جاري التحميل للذاكرة (يرجى عدم غلق المتصفح)...', 'info');
            reader.readAsArrayBuffer(currentFile);
        }
    </script>
</body>
</html>
